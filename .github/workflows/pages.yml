# Pregeneruje statické stránky pre zdieľanie a Google (eventy, jazdci, články).
# Beží po každej zmene na main a každé 3 hodiny, aby nové články mali vlastnú adresu s náhľadom.
name: Stránky pre zdieľanie
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-pages.mjs
      - name: Uložiť zmeny
        run: |
          git config user.name "gosko-bot"
          git config user.email "gosko-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Bez zmien"; else git commit -m "Stránky pre zdieľanie: aktualizácia" && git push; fi
