<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOSko sa presťahovalo</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://gosko.sk/">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;color:#F3EBDD;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  main{padding:24px 16px;max-width:32rem;text-align:center}
  h1{font-size:1.6rem;margin:0 0 12px}
  a{color:#fff;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>GOSko sa presťahovalo</h1>
  <p>Nová adresa je <a id="go" href="https://gosko.sk/">gosko.sk</a>. Ak sa stránka neotvorí sama, ťukni na odkaz.</p>
</main>
<script>
/* Stará adresa GOSko na GitHub Pages. Presmeruje na novú doménu a zachová hash (napr. starý QR #/checkin/<token>).
   QR passy uložené v tomto prehliadači prenesie cez #/import-passes/<base64url(JSON)>, lebo localStorage sa pri zmene domény stratí.
   Nasadzuje sa ako index.html (a sw.js) do vetvy gh-pages. Pri zmene domény uprav NEW_ORIGIN. */
const NEW_ORIGIN = 'https://gosko.sk';

/* encode:start */
function encodePasses(list) {
  const FIELDS = ['token', 'eventId', 'event', 'date', 'name', 'category'];
  const slim = (Array.isArray(list) ? list : []).slice(0, 20).map(p => Object.fromEntries(FIELDS.map(k => [k, String(p[k] ?? '')])));
  const bytes = new TextEncoder().encode(JSON.stringify(slim));
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function target(origin, hash, passes) {
  const h = hash && hash !== '#' ? hash : '';
  if (!passes.length) return origin + '/' + h;
  return origin + '/#/import-passes/' + encodePasses(passes) + (h && h !== '#/' ? '?to=' + encodeURIComponent(h) : '');
}
/* encode:end */

(function () {
  let passes = [];
  try {
    const raw = JSON.parse(localStorage.getItem('gosko:passes') || '[]');
    if (Array.isArray(raw)) passes = raw.filter(p => p && typeof p === 'object' && typeof p.token === 'string');
  } catch (e) {}
  let url;
  try { url = target(NEW_ORIGIN, location.hash, passes); } catch (e) { url = target(NEW_ORIGIN, location.hash, []); }
  document.getElementById('go').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
