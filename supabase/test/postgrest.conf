# PostgREST pre lokálne testy (npm run test:db, npm run test:api-int).
# Iba testovacia DB gosko_test na lokálnom sockete. Tajomstvo nižšie je testovacie, nie produkčné.
db-uri = "postgresql://authenticator@/gosko_test?host=/tmp&port=5432"
db-schemas = "public"
db-anon-role = "anon"
db-pool = 5
db-config = false
db-channel-enabled = false
jwt-secret = "gosko-local-test-jwt-secret-not-for-production-2026"
server-host = "127.0.0.1"
server-port = 3901
log-level = "error"
openapi-mode = "follow-privileges"
